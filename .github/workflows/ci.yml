name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Toolchains: rustfmt, clippy and the MSRV test job run on Rust 1.94.0, the
# workspace `rust-version`. Each Rust release adds clippy lints, so a pinned
# toolchain changes their results only in a commit that moves the pin; the
# test matrix and the other jobs run on the latest stable Rust, and the fuzz
# smoke test on nightly (libFuzzer needs it). When the MSRV changes, move the
# pins with it (crates/recast-radar-tools/tests/readme.rs fails until
# Cargo.toml, the README and these pins agree).
#
# Test files that are not committed are downloaded into a cache
# ($RECAST_RADAR_TESTDATA, read by recast-radar-testdata). The cache is keyed
# on the testdata manifests: a manifest change starts from an empty cache, so
# a cached file never predates its manifest entry (a cached file whose sha256
# no longer matches is a test error, not a re-download). Within one manifest
# version the cache grows with the tests: a run that downloads new files saves
# a new entry, and later runs restore the newest.

jobs:
  fmt:
    name: rustfmt (Rust 1.94.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (Rust 1.94.0, MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Every target (tests, examples, benches, bins) with every feature.
      # Library crates deny unwrap/expect from their roots; test crates
      # exempt their helpers (clippy.toml says how).
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }}, stable)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RECAST_RADAR_TESTDATA: ${{ github.workspace }}/.testdata-cache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Restore testdata cache
        id: testdata-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.RECAST_RADAR_TESTDATA }}
          key: testdata-${{ runner.os }}-${{ hashFiles('testdata/**/manifest.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: testdata-${{ runner.os }}-${{ hashFiles('testdata/**/manifest.toml') }}-
      - name: List cached testdata
        shell: bash
        run: bash tools/ci/testdata-cache-list.sh > "$RUNNER_TEMP/testdata-before.txt"
      - run: cargo test --workspace --locked --no-fail-fast
      # `encode_many` and `EncoderPool` sit behind recast-radar-bzip2's
      # `rayon` feature, which no workspace crate enables yet, so the run
      # above never compiles them; clippy's --all-features build does not
      # run their tests.
      - run: cargo test -p recast-radar-bzip2 --features rayon --locked --no-fail-fast -- encode_many EncoderPool
      # recast-radar-core with its serde feature, which the workspace run
      # leaves off: the serde round trip on real files (tests/serde_real.rs)
      # and the serde unit tests in src/ (FM301 spelling of field names).
      - run: cargo test --locked -p recast-radar-core --features serde
      - name: Check for new testdata downloads
        id: testdata-new
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          bash tools/ci/testdata-cache-list.sh > "$RUNNER_TEMP/testdata-after.txt"
          if cmp -s "$RUNNER_TEMP/testdata-before.txt" "$RUNNER_TEMP/testdata-after.txt"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save testdata cache
        if: ${{ !cancelled() && steps.testdata-new.outputs.changed == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.RECAST_RADAR_TESTDATA }}
          key: ${{ steps.testdata-cache.outputs.cache-primary-key }}

  msrv:
    name: test (Rust 1.94.0, MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RECAST_RADAR_TESTDATA: ${{ github.workspace }}/.testdata-cache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Restore testdata cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.RECAST_RADAR_TESTDATA }}
          key: testdata-${{ runner.os }}-${{ hashFiles('testdata/**/manifest.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: testdata-${{ runner.os }}-${{ hashFiles('testdata/**/manifest.toml') }}-
      - run: cargo test --workspace --locked --no-fail-fast

  docs:
    name: docs and packages (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Broken intra-doc links and other rustdoc warnings fail the build
      # (missing_docs itself is a workspace lint, denied in every build).
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # A dry run: builds and verifies the .crate file of every workspace
      # crate under target/package. Nothing is uploaded. The script counts
      # the expected warnings (excluded test and example targets, no
      # repository link) and fails on any other; see its header.
      - run: bash tools/ci/package-check.sh

  features:
    name: facade features, pure Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      # `--no-dev-deps` removes dev-dependencies from the manifests while
      # cargo-hack runs, so cargo prunes Cargo.lock and `--locked` would fail.
      # Check that the lock file is current first instead.
      - run: cargo fetch --locked
      # Each facade feature alone, plus no features, the defaults and all
      # features (cargo-hack adds those runs).
      - run: cargo hack check -p recast-radar-tools --each-feature --no-dev-deps
      # No C or C++ build without `net`, for any target; see the script header.
      - run: bash tools/ci/pure-rust-check.sh

  wasm:
    name: wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      # Every crate except networking and the test corpus (the bench binary
      # included), plus the facade without `net`; see the script header.
      - run: bash tools/ci/wasm-check.sh

  golden:
    name: Level II goldens reproduce
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RECAST_RADAR_TESTDATA: ${{ github.workspace }}/.testdata-cache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # MetPy 1.7.1 and arm_pyart 2.2.5, the versions the committed goldens
      # were written with (the script refuses any other), with the rest of
      # the environment pinned as it was when the check last passed.
      - run: python -m pip install -r tools/ci/golden-requirements.txt
      - name: Restore testdata cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.RECAST_RADAR_TESTDATA }}
          key: testdata-${{ runner.os }}-${{ hashFiles('testdata/**/manifest.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: testdata-${{ runner.os }}-${{ hashFiles('testdata/**/manifest.toml') }}-
      # tools/level2_golden.py --check all: every committed golden under
      # testdata/level2/golden must be reproduced byte for byte.
      - run: bash tools/ci/level2-golden-check.sh
        env:
          RECAST_RADAR_GOLDEN_PYTHON: python

  examples:
    name: example outputs match the docs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RECAST_RADAR_TESTDATA: ${{ github.workspace }}/.testdata-cache
      # The examples' output does not depend on these; thin LTO keeps the
      # release build short.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Restore testdata cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.RECAST_RADAR_TESTDATA }}
          key: testdata-${{ runner.os }}-${{ hashFiles('testdata/**/manifest.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: testdata-${{ runner.os }}-${{ hashFiles('testdata/**/manifest.toml') }}-
      # Runs every facade example whose output README.md and docs/guide/
      # show, as their `<!-- output: ... -->` markers say, and fails when a
      # shown output differs (ubuntu-latest's python3 has tomllib).
      - run: python3 tools/check_example_outputs.py

  fuzz:
    name: fuzz harness compiles, regressions replay (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RECAST_RADAR_TESTDATA: ${{ github.workspace }}/.testdata-cache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # `fuzz/` is its own workspace, so the jobs above never build it, and a
      # renamed decoder entry point would break it unnoticed. Without the
      # `libfuzzer` feature this checks the harness library and `fuzz-tools`
      # on stable (the libFuzzer binaries need nightly; see fuzz/README.md).
      - run: cargo check --manifest-path fuzz/Cargo.toml --workspace --all-targets --no-default-features --locked
      # Every committed fuzz regression input through its target and
      # io-router, with debug assertions and overflow checks.
      - run: cargo run --locked --release --manifest-path fuzz/tools/Cargo.toml -- regressions

  fuzz-smoke:
    name: fuzz smoke run (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RECAST_RADAR_TESTDATA: ${{ github.workspace }}/.testdata-cache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Restore testdata cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.RECAST_RADAR_TESTDATA }}
          key: testdata-${{ runner.os }}-${{ hashFiles('testdata/**/manifest.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: testdata-${{ runner.os }}-${{ hashFiles('testdata/**/manifest.toml') }}-
      # Seeds from the real corpus, then every target for 60 s; fails on any
      # crash, timeout or out-of-memory input.
      - run: bash tools/ci/fuzz-smoke.sh 60
      - name: Keep fuzz findings
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-findings
          path: |
            fuzz/artifacts
            fuzz/logs
          retention-days: 14
