[package]
name = "recast-radar-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust weather radar toolkit: decoders, data access, corrections, derived products, gridding, tracking and rendering"
readme.workspace = true
keywords = ["radar", "weather", "meteorology", "nexrad", "odim"]
categories = ["science", "science::geo", "parser-implementations"]

[package.metadata.docs.rs]
all-features = true

# Every member crate is optional except the data model. A feature enables its
# module and the features of the facade crates that crate normally depends on,
# so every type a module's API names is reachable through the facade. See
# docs/design/packaging.md.
[features]
default = ["io", "correct", "filters", "retrieve", "map"]
full = [
    "io",
    "net",
    "correct",
    "filters",
    "retrieve",
    "map",
    "track",
    "render",
    "scattering",
    "serde",
]

# Formats. `io` is the sniffing router plus every format decoder.
nexrad = ["dep:recast-radar-io-nexrad"]
odim = ["dep:recast-radar-io-odim"]
cfradial = ["dep:recast-radar-io-cfradial"]
dorade = ["dep:recast-radar-io-dorade"]
jma = ["dep:recast-radar-io-jma"]
io = ["dep:recast-radar-io", "nexrad", "odim", "cfradial", "dorade", "jma"]

# Data access (AWS archive, real-time chunks, international feeds).
net = ["dep:recast-radar-data"]

# Algorithms.
correct = ["dep:recast-radar-correct"]
filters = ["dep:recast-radar-filters"]
retrieve = ["dep:recast-radar-retrieve", "correct"]
map = ["dep:recast-radar-map", "correct", "filters"]
track = ["dep:recast-radar-track", "correct", "map", "retrieve"]
render = ["dep:recast-radar-render", "correct"]
scattering = ["dep:recast-radar-scattering"]

serde = ["recast-radar-core/serde"]

[dependencies]
recast-radar-core = { path = "../recast-radar-core" }
recast-radar-correct = { path = "../recast-radar-correct", optional = true }
recast-radar-data = { path = "../recast-radar-data", optional = true }
recast-radar-filters = { path = "../recast-radar-filters", optional = true }
recast-radar-io = { path = "../recast-radar-io", optional = true }
recast-radar-io-cfradial = { path = "../recast-radar-io-cfradial", optional = true }
recast-radar-io-dorade = { path = "../recast-radar-io-dorade", optional = true }
recast-radar-io-jma = { path = "../recast-radar-io-jma", optional = true }
recast-radar-io-nexrad = { path = "../recast-radar-io-nexrad", optional = true }
recast-radar-io-odim = { path = "../recast-radar-io-odim", optional = true }
recast-radar-map = { path = "../recast-radar-map", optional = true }
recast-radar-render = { path = "../recast-radar-render", optional = true }
recast-radar-retrieve = { path = "../recast-radar-retrieve", optional = true }
recast-radar-scattering = { path = "../recast-radar-scattering", optional = true }
recast-radar-track = { path = "../recast-radar-track", optional = true }

[[test]]
name = "facade_real_files"
required-features = ["io", "correct", "filters", "map"]

[lints]
workspace = true
