[package]
name = "recast-radar-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust weather radar toolkit: decoders, data access, corrections, derived products, gridding, tracking and rendering"
readme.workspace = true
keywords = ["radar", "weather", "meteorology", "nexrad", "odim"]
categories = ["science", "science::geo", "parser-implementations"]
# The tests check this repository (its README, manifests, CI workflow and
# real-file corpus), not the packaged crate, so they are not packaged.
exclude = ["tests/"]

[package.metadata.docs.rs]
all-features = true

# Every member crate is optional except the data model. A feature enables its
# module and the features of the member crates that crate normally depends on,
# so every type a module's API names is reachable through the facade.
# tests/readme.rs checks the rule. See docs/design/packaging.md.
[features]
default = ["io", "correct", "filters", "retrieve", "map"]
full = [
    "io",
    "write",
    "net",
    "correct",
    "filters",
    "retrieve",
    "map",
    "track",
    "render",
    "scattering",
    "serde",
]

# Formats. `io` is the sniffing router plus every format decoder.
nexrad = ["dep:recast-radar-io-nexrad"]
# The Level II writer (`nexrad::write`: Archive II files, real-time chunks,
# GR2Analyst polling directories) and its bzip2 encoder. The CfRadial and
# ODIM_H5 writers come with their formats.
write = ["nexrad", "recast-radar-io-nexrad/write"]
# The HDF5 reader and writer and the netCDF-4 data model under ODIM_H5 and
# netCDF-4 CfRadial.
hdf5 = ["dep:recast-radar-hdf5"]
level3 = ["dep:recast-radar-io-level3"]
odim = ["dep:recast-radar-io-odim", "hdf5"]
cfradial = ["dep:recast-radar-io-cfradial", "hdf5"]
dorade = ["dep:recast-radar-io-dorade"]
jma = ["dep:recast-radar-io-jma"]
io = ["dep:recast-radar-io", "nexrad", "level3", "odim", "cfradial", "dorade", "jma"]

# Data access (AWS archive, real-time chunks, international feeds).
net = ["dep:recast-radar-data"]

# Algorithms.
correct = ["dep:recast-radar-correct"]
filters = ["dep:recast-radar-filters"]
retrieve = ["dep:recast-radar-retrieve", "correct"]
map = ["dep:recast-radar-map", "correct", "filters"]
track = ["dep:recast-radar-track", "correct", "map", "retrieve"]
render = ["dep:recast-radar-render", "correct"]
scattering = ["dep:recast-radar-scattering"]

# `Serialize` and `Deserialize` on the data model.
serde = ["recast-radar-core/serde"]

[dependencies]
recast-radar-core = { version = "0.1.0", path = "../recast-radar-core" }
recast-radar-correct = { version = "0.1.0", path = "../recast-radar-correct", optional = true }
recast-radar-data = { version = "0.1.0", path = "../recast-radar-data", optional = true }
recast-radar-filters = { version = "0.1.0", path = "../recast-radar-filters", optional = true }
recast-radar-hdf5 = { version = "0.1.0", path = "../recast-radar-hdf5", optional = true }
recast-radar-io = { version = "0.1.0", path = "../recast-radar-io", optional = true }
recast-radar-io-cfradial = { version = "0.1.0", path = "../recast-radar-io-cfradial", optional = true }
recast-radar-io-dorade = { version = "0.1.0", path = "../recast-radar-io-dorade", optional = true }
recast-radar-io-jma = { version = "0.1.0", path = "../recast-radar-io-jma", optional = true }
recast-radar-io-level3 = { version = "0.1.0", path = "../recast-radar-io-level3", optional = true }
recast-radar-io-nexrad = { version = "0.1.0", path = "../recast-radar-io-nexrad", optional = true }
recast-radar-io-odim = { version = "0.1.0", path = "../recast-radar-io-odim", optional = true }
recast-radar-map = { version = "0.1.0", path = "../recast-radar-map", optional = true }
recast-radar-render = { version = "0.1.0", path = "../recast-radar-render", optional = true }
recast-radar-retrieve = { version = "0.1.0", path = "../recast-radar-retrieve", optional = true }
recast-radar-scattering = { version = "0.1.0", path = "../recast-radar-scattering", optional = true }
recast-radar-track = { version = "0.1.0", path = "../recast-radar-track", optional = true }

[dev-dependencies]
# Without `download`: the facade tests read committed fixtures only, and the
# examples (which cargo builds with the dev-dependencies) do not pull the
# downloader's HTTPS stack (ureq, rustls, ring) into `cargo run --example`.
recast-radar-testdata = { path = "../recast-radar-testdata", default-features = false }

[[test]]
name = "facade_real_files"
required-features = ["io", "correct", "filters", "map"]

# Examples. The README and the user guide (docs/guide/) show these files
# verbatim; tests/readme.rs fails when a copy drifts from its file.
[[example]]
name = "decode_level2"
required-features = ["nexrad"]

[[example]]
name = "read_any"
required-features = ["io"]

[[example]]
name = "physical_values"
required-features = ["io"]

[[example]]
name = "fetch_aws"
required-features = ["net", "nexrad"]

[[example]]
name = "dealias_velocity"
required-features = ["nexrad", "correct"]

[[example]]
name = "composite"
required-features = ["io", "map", "render"]

[[example]]
name = "render_png"
required-features = ["nexrad", "correct", "render"]

[[example]]
name = "write_formats"
required-features = ["io", "write"]

[lints]
workspace = true
