[package]
name = "recast-radar-map"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Weather radar geometry products: composites, echo tops, VIL, hail, cross sections, RHI panels, volume resampling and Cartesian gridding"
readme.workspace = true
keywords = ["radar", "weather", "composite", "cross-section", "gridding"]
categories = ["science::geo", "algorithms"]
# Not packaged: the integration tests read the repository's testdata/
# through the unpublished recast-radar-testdata crate.
exclude = ["tests/"]

[dependencies]
rayon.workspace = true
recast-radar-core = { version = "0.1.3", path = "../recast-radar-core" }
recast-radar-correct = { version = "0.1.3", path = "../recast-radar-correct" }
recast-radar-filters = { version = "0.1.3", path = "../recast-radar-filters" }
thiserror.workspace = true

[dev-dependencies]
# Real-data tests: corpus files decoded with the real readers, goldens as JSON.
chrono.workspace = true
recast-radar-io-cfradial = { path = "../recast-radar-io-cfradial" }
recast-radar-io-dorade = { path = "../recast-radar-io-dorade" }
recast-radar-io-jma = { path = "../recast-radar-io-jma" }
recast-radar-io-nexrad = { path = "../recast-radar-io-nexrad" }
recast-radar-testdata = { path = "../recast-radar-testdata" }
serde_json.workspace = true

[lints]
workspace = true
