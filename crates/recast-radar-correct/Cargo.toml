[package]
name = "recast-radar-correct"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Weather radar data correction: Doppler velocity dealiasing"
readme.workspace = true
keywords = ["radar", "weather", "dealiasing", "doppler", "meteorology"]
categories = ["science::geo", "algorithms"]
# Not packaged: the integration tests read the repository's testdata/
# through the unpublished recast-radar-testdata crate, and the examples are
# developer probes built on dev-dependencies.
exclude = ["tests/", "examples/"]

[dependencies]
chrono.workspace = true
rayon.workspace = true
recast-radar-core = { version = "0.1.3", path = "../recast-radar-core" }

[dev-dependencies]
image.workspace = true
recast-radar-io-jma = { path = "../recast-radar-io-jma" }
recast-radar-io-nexrad = { path = "../recast-radar-io-nexrad" }
recast-radar-testdata = { path = "../recast-radar-testdata" }
serde_json.workspace = true

[lints]
workspace = true
