[package]
name = "recast-radar-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Weather radar data access: NEXRAD Level II archive and real-time chunks on AWS, site catalogs, international and community feeds"
readme.workspace = true
keywords = ["nexrad", "radar", "weather", "aws", "realtime"]
categories = ["science::geo", "web-programming::http-client"]
# Not packaged: the integration tests read the repository's testdata/
# through the unpublished recast-radar-testdata crate, and the examples are
# developer probes built on dev-dependencies.
exclude = ["tests/", "examples/"]

[features]
default = ["net"]
# Blocking HTTPS client (reqwest + rustls): AWS Level II archive and
# real-time chunk listing/download, international provider catalog probes,
# GDEX, grid-product and tropical feeds. Without it the crate keeps only
# network-free code (types, site catalogs, key/listing parsers, selection
# logic, local cache helpers) and builds for wasm32-unknown-unknown.
net = ["dep:reqwest"]
# `realtime::stream::ChunkStream`, a `futures_core::Stream` over the same
# real-time chunk planner as the blocking `ChunkIterator`, generic over an
# `AsyncChunkTransport`. Runtime-agnostic: it never sleeps or spawns.
async = ["dep:futures-core"]
# `realtime::stream::AsyncReqwestTransport`: a non-blocking HTTPS client for
# `ChunkStream` (reqwest's async client; Tokio on native targets, the browser's
# fetch on wasm32-unknown-unknown). Does not enable the blocking client (`net`).
async-client = ["async", "dep:reqwest"]

[dependencies]
chrono.workspace = true
futures-core = { version = "0.3", optional = true }
quick-xml.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Volume model types for examples/feeds_survey.rs; the library itself names
# no model items.
recast-radar-core = { path = "../recast-radar-core" }
# Decode checks in unit tests, examples/intl_probe.rs (live download +
# decode smoke) and examples/feeds_survey.rs; the library itself does not
# use the format router.
recast-radar-io = { path = "../recast-radar-io" }
# ODIM Cartesian IMAGE products (IMGW POLRAD CMAX) in examples/feeds_survey.rs;
# the volume router does not read them.
recast-radar-io-odim = { path = "../recast-radar-io-odim" }
# JMA station headers for the caller-provided JmaCatalogProvider station
# table tests; the library itself never parses GRIB2.
recast-radar-io-jma = { path = "../recast-radar-io-jma" }
# Message 5 from real Start chunks for the timing model tests
# (tests/timing.rs); the library itself does not decode Level II messages.
recast-radar-io-nexrad = { path = "../recast-radar-io-nexrad" }
# Decompresses the LDM records of a Level II volume the decoder refuses
# (tests/feeds_known_failures.rs counts its radials against Py-ART's).
recast-radar-bzip2 = { path = "../recast-radar-bzip2" }
recast-radar-testdata = { path = "../recast-radar-testdata" }

# Drives AsyncReqwestTransport in tests/iterator.rs (already in the lockfile
# through reqwest).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", default-features = false, features = ["net", "rt", "time"] }

# Reads local files only, so it needs no feature.
[[example]]
name = "feeds_survey"

# Every other example talks to live endpoints.
[[example]]
name = "feeds_plans"
required-features = ["net"]

[[example]]
name = "intl_probe"
required-features = ["net"]

[[example]]
name = "live_decode"
required-features = ["net"]

[[example]]
name = "kmkx_fetch"
required-features = ["net"]

[[example]]
name = "probe_sources"
required-features = ["net"]

[[example]]
name = "site_list_probe"
required-features = ["net"]

[[example]]
name = "tile_fetch_probe"
required-features = ["net"]

[lints]
workspace = true
