[package]
name = "recast-radar-io-bufr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust WMO BUFR decoder and Meteo-France polar radar (PAG, PAM) volume reader"
readme.workspace = true
keywords = ["bufr", "radar", "weather", "meteo-france", "wmo"]
categories = ["science::geo", "parser-implementations", "encoding"]
# Not packaged: the integration tests read the repository's testdata/
# through the unpublished recast-radar-testdata crate, and the example is a
# developer probe.
exclude = ["tests/", "examples/"]

[dependencies]
chrono.workspace = true
# Meteo-France files are gzip members (some ending in a compress(1) member).
flate2.workspace = true
recast-radar-core = { version = "0.1.3", path = "../recast-radar-core" }
thiserror.workspace = true

[dev-dependencies]
recast-radar-testdata = { path = "../recast-radar-testdata" }
# The numpy_bufr goldens (tools/meteofrance_bufr_golden.py).
serde_json.workspace = true

[lints]
workspace = true
