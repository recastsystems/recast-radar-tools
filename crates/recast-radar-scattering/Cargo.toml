[package]
name = "recast-radar-scattering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Typed, validated radar-scattering primitives and offline LUTs"
keywords = ["radar", "scattering", "t-matrix", "microphysics", "polarimetric"]
categories = ["science", "science::geo", "simulation"]
# Not packaged: the integration tests read the repository's testdata/
# through the unpublished recast-radar-testdata crate, and the examples are
# developer probes built on dev-dependencies; tools/ holds the offline
# PyTMatrix table generator.
exclude = ["tests/", "examples/", "tools/"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
thiserror.workspace = true

[dev-dependencies]
# Real inputs for the unit tests: the committed PyTMatrix 0.3.3 tables and
# WRF P3 tables of the corpus (testdata/scattering/manifest.toml).
recast-radar-testdata = { path = "../recast-radar-testdata" }
# Golden JSON floats must parse to the exact f64 the generator wrote.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lints]
workspace = true
