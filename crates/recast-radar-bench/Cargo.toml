[package]
name = "recast-radar-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Single- and multi-core decode and render benchmark harness for recast-radar-tools"
keywords = ["radar", "benchmark", "nexrad", "weather"]
categories = ["development-tools::profiling", "science::geo"]
# Benchmark harness binary; not a library to publish.
publish = false
default-run = "recast-radar-bench"

[features]
# A/B switch for the cross-library decode benchmark (src/bin/decode_bench.rs):
# forwards to the Level II decoder's paired bzip2 record decode.
paired-bzip2 = ["recast-radar-io-nexrad/paired-bzip2"]

[dependencies]
# The dealias evaluation reads timestamps from its JSON config.
chrono = { workspace = true, features = ["serde"] }
rayon.workspace = true
recast-radar-core = { version = "0.1.0", path = "../recast-radar-core" }
recast-radar-correct = { version = "0.1.0", path = "../recast-radar-correct" }
recast-radar-io = { version = "0.1.0", path = "../recast-radar-io" }
# The per-format readers, called directly by src/bin/decode_bench.rs.
recast-radar-io-cfradial = { version = "0.1.0", path = "../recast-radar-io-cfradial" }
recast-radar-io-dorade = { version = "0.1.0", path = "../recast-radar-io-dorade" }
recast-radar-io-jma = { version = "0.1.0", path = "../recast-radar-io-jma" }
recast-radar-io-level3 = { version = "0.1.0", path = "../recast-radar-io-level3" }
recast-radar-io-nexrad = { version = "0.1.0", path = "../recast-radar-io-nexrad" }
recast-radar-io-odim = { version = "0.1.0", path = "../recast-radar-io-odim" }
recast-radar-render = { version = "0.1.0", path = "../recast-radar-render" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Real-data tests: corpus files decoded with the bench's own byte router, goldens as JSON.
recast-radar-testdata = { path = "../recast-radar-testdata" }

[lints]
workspace = true
