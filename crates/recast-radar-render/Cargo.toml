[package]
name = "recast-radar-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CPU raster rendering of weather radar sweeps to PNG with color tables and GR .pal palettes"
readme.workspace = true
keywords = ["radar", "weather", "png", "colormap", "rendering"]
categories = ["science::geo", "rendering", "visualization"]
# Not packaged: the integration tests read the repository's testdata/
# through the unpublished recast-radar-testdata crate, and the examples are
# developer probes built on dev-dependencies.
exclude = ["tests/", "examples/"]

[dependencies]
image.workspace = true
recast-radar-core = { version = "0.1.2", path = "../recast-radar-core" }
recast-radar-correct = { version = "0.1.2", path = "../recast-radar-correct" }
rayon.workspace = true
thiserror.workspace = true

[dev-dependencies]
recast-radar-filters = { path = "../recast-radar-filters" }
recast-radar-io-nexrad = { path = "../recast-radar-io-nexrad" }
recast-radar-map = { path = "../recast-radar-map" }
recast-radar-retrieve = { path = "../recast-radar-retrieve" }
recast-radar-testdata = { path = "../recast-radar-testdata" }
recast-radar-track = { path = "../recast-radar-track" }
serde_json.workspace = true

[lints]
workspace = true
