[package]
name = "recast-radar-io-level3"
description = "Pure-Rust decoder for NEXRAD and TDWR Level III products"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
keywords = ["nexrad", "level3", "tdwr", "radar", "weather"]
categories = ["science::geo", "parser-implementations", "encoding"]
# Not packaged: the integration tests read the repository's testdata/
# through the unpublished recast-radar-testdata crate.
exclude = ["tests/"]

[dependencies]
recast-radar-bzip2 = { version = "0.1.2", path = "../recast-radar-bzip2" }
# Not the workspace entry: that one adds the `now` feature, which this crate
# does not use.
chrono = { version = "0.4", default-features = false }
# zlib-rs backend (pure Rust): NOAAPort distributions wrap products in zlib frames.
flate2.workspace = true
recast-radar-core = { version = "0.1.2", path = "../recast-radar-core" }
thiserror.workspace = true

[dev-dependencies]
# An independent reference decoder for the differential test in tests/radial_generic.rs.
bzip2.workspace = true
# SHA-256 of decoded levels and text for the golden digests (tests/common).
recast-radar-testdata = { path = "../recast-radar-testdata" }

[lints]
workspace = true
