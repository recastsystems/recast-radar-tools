[package]
name = "recast-radar-io-level3"
description = "Pure-Rust decoder for NEXRAD and TDWR Level III products"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Versions and features match main's [workspace.dependencies]; switch to
# `.workspace = true` when this branch merges into main.
bzip2 = "0.6"
chrono = { version = "0.4", default-features = false }
# zlib-rs backend (pure Rust): NOAAPort distributions wrap products in zlib frames.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
thiserror = "2.0"

[dev-dependencies]
# Parity test against the VAD Wind Profile decoder this crate replaces
# (tests/vwp.rs); removed together with `recast_radar_io_nexrad::level3_vwp`.
recast-radar-io-nexrad = { path = "../recast-radar-io-nexrad" }

[lints]
workspace = true
