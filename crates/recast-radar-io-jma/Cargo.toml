[package]
name = "recast-radar-io-jma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust decoder for Japan Meteorological Agency polar-coordinate radar GRIB2 tar archives"
readme.workspace = true
keywords = ["jma", "grib2", "radar", "weather", "japan"]
categories = ["science::geo", "parser-implementations", "encoding"]
# Not packaged: the integration tests read the repository's testdata/
# through the unpublished recast-radar-testdata crate, and the examples are
# developer probes built on dev-dependencies.
exclude = ["tests/", "examples/"]

[dependencies]
chrono.workspace = true
recast-radar-core = { version = "0.1.3", path = "../recast-radar-core" }
thiserror.workspace = true

[dev-dependencies]
# Real corpus files (spec section 5).
recast-radar-testdata = { path = "../recast-radar-testdata" }
# The ecCodes golden (tools/jma_eccodes_golden.py).
serde_json.workspace = true

[lints]
workspace = true
