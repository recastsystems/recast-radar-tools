[package]
name = "recast-radar-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Format-sniffing weather radar reader that routes bytes to the recast-radar-io-* decoders"
readme.workspace = true
keywords = ["radar", "weather", "nexrad", "odim", "cfradial"]
categories = ["science::geo", "parser-implementations"]
# Not packaged: the integration tests read the repository's testdata/
# through the unpublished recast-radar-testdata crate, and the examples are
# developer probes built on dev-dependencies.
exclude = ["tests/", "examples/"]

[dependencies]
flate2.workspace = true
recast-radar-core = { version = "0.1.1", path = "../recast-radar-core" }
recast-radar-io-cfradial = { version = "0.1.1", path = "../recast-radar-io-cfradial" }
recast-radar-io-dorade = { version = "0.1.1", path = "../recast-radar-io-dorade" }
recast-radar-io-jma = { version = "0.1.1", path = "../recast-radar-io-jma" }
recast-radar-io-level3 = { version = "0.1.1", path = "../recast-radar-io-level3" }
recast-radar-io-nexrad = { version = "0.1.1", path = "../recast-radar-io-nexrad" }
recast-radar-io-odim = { version = "0.1.1", path = "../recast-radar-io-odim" }
thiserror.workspace = true

[dev-dependencies]
# Only for examples/intl_assembly_probe.rs (live download + decode + merge).
recast-radar-data = { path = "../recast-radar-data" }
# The Level II writer, for tests/level2_writer_intl.rs and the
# level2_writer_check and level2_convert examples.
recast-radar-io-nexrad = { path = "../recast-radar-io-nexrad", features = ["write"] }
# Real corpus files (spec section 5) and real-file resource-limit tests
# (tests/limits_real.rs).
recast-radar-testdata = { path = "../recast-radar-testdata" }
# The writer tests' structural diff of two volumes (the model serialized to
# JSON, so the core crate's serde feature), and
# examples/level2_writer_check.rs (the manifest of written files).
recast-radar-core = { path = "../recast-radar-core", features = ["serde"] }
serde_json.workspace = true

[lints]
workspace = true
