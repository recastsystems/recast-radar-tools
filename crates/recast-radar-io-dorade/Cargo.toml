[package]
name = "recast-radar-io-dorade"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust DORADE sweepfile decoder and mobile-radar (DOW, COW, RaXPol) archive ingest"
readme.workspace = true
keywords = ["dorade", "radar", "weather", "sweepfile", "mobile-radar"]
categories = ["science::geo", "parser-implementations", "encoding"]
# Not packaged: the integration tests read the repository's testdata/
# through the unpublished recast-radar-testdata crate, and the examples are
# developer probes built on dev-dependencies.
exclude = ["tests/", "examples/"]

[dependencies]
chrono.workspace = true
rayon.workspace = true
recast-radar-core = { version = "0.1.2", path = "../recast-radar-core" }
thiserror.workspace = true
zip.workspace = true

[dev-dependencies]
# Level II decoder for `.msg31` members in the examples and the ignored
# mobile-radar corpus test; the library takes it as a parameter instead.
recast-radar-io-nexrad = { path = "../recast-radar-io-nexrad" }
# Real corpus files (spec section 5).
recast-radar-testdata = { path = "../recast-radar-testdata" }
# Goldens from independent readers (testdata/golden/dorade).
serde_json.workspace = true

[lints]
workspace = true
