[package]
name = "recast-radar-track"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Weather radar storm cell identification and tracking, rotation tracks, swaths and temporal grid products"
readme.workspace = true
keywords = ["radar", "weather", "storm", "tracking", "meteorology"]
categories = ["science::geo", "algorithms"]
# Not packaged: the integration tests read the repository's testdata/
# through the unpublished recast-radar-testdata crate, and the examples are
# developer probes built on dev-dependencies.
exclude = ["tests/", "examples/"]

[dependencies]
chrono.workspace = true
recast-radar-core = { version = "0.1.2", path = "../recast-radar-core" }
recast-radar-correct = { version = "0.1.2", path = "../recast-radar-correct" }
recast-radar-map = { version = "0.1.2", path = "../recast-radar-map" }
recast-radar-retrieve = { version = "0.1.2", path = "../recast-radar-retrieve" }

[dev-dependencies]
# Real-data tests: corpus files decoded with the real readers, goldens as
# JSON, gzip for the DORADE sweep-sequence archive.
flate2.workspace = true
image.workspace = true
recast-radar-io-dorade = { path = "../recast-radar-io-dorade" }
recast-radar-io-nexrad = { path = "../recast-radar-io-nexrad" }
recast-radar-io = { path = "../recast-radar-io" }
recast-radar-filters = { path = "../recast-radar-filters" }
recast-radar-testdata = { path = "../recast-radar-testdata" }
serde_json.workspace = true

[lints]
workspace = true
