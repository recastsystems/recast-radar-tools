[package]
name = "recast-radar-bzip2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust bzip2 compressor and decompressor without unsafe code, tuned for NEXRAD Level II LDM records"
readme = "README.md"
keywords = ["bzip2", "compression", "nexrad", "radar", "no-unsafe"]
categories = ["compression", "parser-implementations"]
# The encoder benchmark harness links C libbzip2 and is not part of the crate.
exclude = ["bench/"]

[features]
# `encode_many`: compress independent inputs in parallel on rayon.
rayon = ["dep:rayon"]

[dependencies]
rayon = { workspace = true, optional = true }

[dev-dependencies]
# Reference decoder and encoder for the tests: the bzip2 crate's pure-Rust
# backend (libbz2-rs-sys), a port of libbzip2 1.0.8.
bzip2.workspace = true
# A thread pool of known size for the `EncoderPool` test (feature `rayon`).
rayon.workspace = true
recast-radar-testdata = { path = "../recast-radar-testdata" }

[lints]
workspace = true
