[package]
name = "recast-radar-testdata"
description = "Real radar test corpus: manifest, sha256-verified committed fixtures and cached downloads (dev-only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
keywords = ["radar", "weather", "testing", "fixtures", "nexrad"]
categories = ["development-tools::testing", "science::geo"]
publish = false

[dependencies]
# Level II trim tool (src/trim.rs): pure-Rust bzip2 (libbz2-rs-sys) and gzip (zlib-rs).
bzip2 = "0.6"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
toml = "1.1"
# HTTPS via rustls is allowed in this dev-only crate (plan: Global Constraints).
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }

[features]
default = ["download"]
# Download entries that are not committed into the cache (ureq with rustls,
# whose crypto provider compiles C). Without it only committed and
# already-cached files resolve; the rest report `TestdataError::Offline`.
download = ["dep:ureq"]

[lints]
workspace = true
