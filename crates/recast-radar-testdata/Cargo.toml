[package]
name = "recast-radar-testdata"
description = "Real radar test corpus: manifest, sha256-verified committed fixtures and cached downloads (dev-only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
toml = "1.1"
# HTTPS via rustls is allowed in this dev-only crate (plan: Global Constraints).
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[lints]
workspace = true
