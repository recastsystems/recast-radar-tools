[package]
name = "recast-radar-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The recast-radar command: inspect, validate, render, fetch, convert and publish weather radar files"
readme = "README.md"
keywords = ["radar", "weather", "nexrad", "cli", "odim"]
categories = ["command-line-utilities", "science::geo"]
default-run = "recast-radar"
# Not packaged: the integration tests read the repository's testdata/
# through the unpublished recast-radar-testdata crate.
exclude = ["tests/"]

[[bin]]
name = "recast-radar"
path = "src/main.rs"

[features]
default = ["net"]
# `fetch`: AWS Level II archive and real-time chunks, Level III, international
# feeds and GR2Analyst polling servers (recast-radar-data, reqwest + rustls).
# Without it the binary makes no network requests and compiles no C.
net = ["dep:recast-radar-data"]

[dependencies]
chrono.workspace = true
clap = { version = "4.6", features = ["derive"] }
flate2.workspace = true
image.workspace = true
rayon.workspace = true
# `summary` serializes the model (`--json`, `dump`).
recast-radar-core = { version = "0.1.1", path = "../recast-radar-core", features = ["serde"] }
recast-radar-data = { version = "0.1.1", path = "../recast-radar-data", optional = true }
recast-radar-io = { version = "0.1.1", path = "../recast-radar-io" }
# The CfRadial 1 and FM301 writers behind `convert --to cfradial1|fm301`.
recast-radar-io-cfradial = { version = "0.1.1", path = "../recast-radar-io-cfradial" }
recast-radar-io-dorade = { version = "0.1.1", path = "../recast-radar-io-dorade" }
recast-radar-io-jma = { version = "0.1.1", path = "../recast-radar-io-jma" }
recast-radar-io-level3 = { version = "0.1.1", path = "../recast-radar-io-level3" }
# The Level II writer behind `convert --to level2` and `publish`.
recast-radar-io-nexrad = { version = "0.1.1", path = "../recast-radar-io-nexrad", features = ["write"] }
# The ODIM_H5 writer behind `convert --to odim`.
recast-radar-io-odim = { version = "0.1.1", path = "../recast-radar-io-odim" }
recast-radar-render = { version = "0.1.1", path = "../recast-radar-render" }
recast-radar-correct = { version = "0.1.1", path = "../recast-radar-correct" }
recast-radar-map = { version = "0.1.1", path = "../recast-radar-map" }
recast-radar-retrieve = { version = "0.1.1", path = "../recast-radar-retrieve" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
recast-radar-testdata = { path = "../recast-radar-testdata" }

[lints]
workspace = true
