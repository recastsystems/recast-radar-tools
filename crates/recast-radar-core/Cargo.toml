[package]
name = "recast-radar-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "FM301 weather radar data model for recast-radar-tools: volumes, sweeps, fields with CF packing, the FM301 group view, beam geometry and field names"
readme.workspace = true
keywords = ["radar", "weather", "meteorology", "remote-sensing", "cfradial"]
categories = ["science", "science::geo", "data-structures"]
# Not packaged: the integration tests read the repository's testdata/
# through the unpublished recast-radar-testdata crate.
exclude = ["tests/"]

[dependencies]
chrono.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[features]
# `Serialize` and `Deserialize` for the data model (`Volume`, `Sweep`,
# `Field`, names, codings, refractivity profiles), with chrono's serde
# support for the timestamps. Off by default. `FieldName` serializes as its
# FM301 spelling (`"DBZH"`). The facade's `serde` feature turns this on.
serde = ["dep:serde", "chrono/serde"]

[dev-dependencies]
# Real-data model tests (tests/real_model.rs, tests/real_merge.rs) and the
# FM301 view and conformance tests (tests/fm301_view.rs,
# tests/fm301_conformance.rs): corpus files decoded with the real readers,
# goldens as JSON. Dev-only cycles through the io crates are allowed by
# cargo; the integration tests link the library build, so the model types
# are shared.
recast-radar-io = { path = "../recast-radar-io" }
recast-radar-io-cfradial = { path = "../recast-radar-io-cfradial" }
recast-radar-io-jma = { path = "../recast-radar-io-jma" }
recast-radar-io-nexrad = { path = "../recast-radar-io-nexrad" }
recast-radar-io-odim = { path = "../recast-radar-io-odim" }
recast-radar-testdata = { path = "../recast-radar-testdata" }
# `float_roundtrip`: exact f64 parsing for the serde round-trip test.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[[test]]
name = "serde_real"
required-features = ["serde"]

[lints]
workspace = true
