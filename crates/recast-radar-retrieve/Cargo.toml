[package]
name = "recast-radar-retrieve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Derived weather radar products: sweep and column products, KDP, attenuation correction, CAPPI, rotation and shear, GBVTD, VAD wind profile"
readme.workspace = true
keywords = ["radar", "weather", "meteorology", "vad", "nexrad"]
categories = ["science::geo", "algorithms"]
# Not packaged: the integration tests read the repository's testdata/
# through the unpublished recast-radar-testdata crate, and the examples are
# developer probes built on dev-dependencies.
exclude = ["tests/", "examples/"]

[dependencies]
chrono.workspace = true
rayon.workspace = true
recast-radar-core = { version = "0.1.3", path = "../recast-radar-core" }
recast-radar-correct = { version = "0.1.3", path = "../recast-radar-correct" }
thiserror.workspace = true

[dev-dependencies]
# Real-data tests: corpus files decoded with the real readers, goldens as JSON.
recast-radar-io-cfradial = { path = "../recast-radar-io-cfradial" }
recast-radar-io-dorade = { path = "../recast-radar-io-dorade" }
recast-radar-io-jma = { path = "../recast-radar-io-jma" }
recast-radar-io-nexrad = { path = "../recast-radar-io-nexrad" }
recast-radar-io-odim = { path = "../recast-radar-io-odim" }
recast-radar-map = { path = "../recast-radar-map" }
recast-radar-testdata = { path = "../recast-radar-testdata" }
serde_json.workspace = true

[lints]
workspace = true
