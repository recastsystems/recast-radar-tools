# cargo-fuzz project for the recast-radar decoders and the bzip2 encoder.
# Not a member of the main workspace (it needs nightly and libFuzzer); see
# README.md.
[package]
name = "recast-radar-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[features]
default = ["libfuzzer"]
# The fuzz_targets binaries need libFuzzer; `tools` (stable replay and seed
# generation) uses only the harness library and turns this off.
libfuzzer = ["dep:libfuzzer-sys"]

[dependencies]
libfuzzer-sys = { version = "0.4", optional = true }
# Reference decoder and encoder for the bzip2-encode target: the bzip2
# crate's default backend, libbz2-rs-sys (a Rust port of libbzip2 1.0.8).
bzip2 = "0.6"
recast-radar-bzip2 = { path = "../crates/recast-radar-bzip2" }
# The model types of the writer comparison (`src/lib.rs`, `compare`).
recast-radar-core = { path = "../crates/recast-radar-core" }
recast-radar-hdf5 = { path = "../crates/recast-radar-hdf5" }
# The `recast-radar` command's input handling and server; without its
# default features, so no network client or C code is built.
recast-radar-cli = { path = "../crates/recast-radar-cli", default-features = false }
# The polling listing parsers; without `net`, so no network client or C code
# is built.
recast-radar-data = { path = "../crates/recast-radar-data", default-features = false }
recast-radar-io = { path = "../crates/recast-radar-io" }
recast-radar-io-cfradial = { path = "../crates/recast-radar-io-cfradial" }
recast-radar-io-dorade = { path = "../crates/recast-radar-io-dorade" }
recast-radar-io-jma = { path = "../crates/recast-radar-io-jma" }
recast-radar-io-level3 = { path = "../crates/recast-radar-io-level3" }
recast-radar-io-nexrad = { path = "../crates/recast-radar-io-nexrad", features = ["write"] }
recast-radar-io-odim = { path = "../crates/recast-radar-io-odim" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "level2-volume"
path = "fuzz_targets/level2-volume.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

