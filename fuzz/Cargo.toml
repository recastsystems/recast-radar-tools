[workspace]
members = [".", "tools"]

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true

[profile.release]
# Same checks as cargo-fuzz builds, so `fuzz-tools replay` panics wherever
# the fuzzer did (arithmetic overflow, debug assertions).
debug-assertions = true
overflow-checks = true
# Line tables for symbolized crash backtraces.
debug = 1

[[bin]]
name = "level3"
path = "fuzz_targets/level3.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]
