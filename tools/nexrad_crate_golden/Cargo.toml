# Golden generator for the Level II messages 3 and 18 from the danielway
# nexrad crates, an independent Rust decoder. Not part of the workspace; run
# it through tools/nexrad_crate_golden.py, which generates src/accessors.rs
# from the pinned nexrad source and points the git dependencies at a local
# clone of that revision.
[package]
name = "nexrad-crate-golden"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
nexrad-data = { git = "https://github.com/danielway/nexrad", rev = "1591b64f7b34b14a88b1f020384c252052c8255f", default-features = false }
nexrad-decode = { git = "https://github.com/danielway/nexrad", rev = "1591b64f7b34b14a88b1f020384c252052c8255f", default-features = false }
serde_json = "1.0"
