# crates/recast-radar-scattering/tools/pytmatrix-0.3.3 (run_all.ps1 in the
# Docker image recorded by the tables' manifest.json files), the post-freeze
# held-out check that recomputed nodes absent from those tables in fresh
# PyTMatrix processes, and the official WRF P3 v5.4 lookup tables the crate
# targets. None of these are radar observations; they are the generator and
# model artifacts the crate's readers and interpolators consume.

