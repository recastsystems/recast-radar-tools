description = "North Dakota State Water Commission KXWA Level II (AR2V0006, ICD date layout), 2026-09-24 21:43:16Z, the whole volume as its GR2Analyst polling directory served it (fetched 21:52Z; still served on 2026-09-25 at 10:30Z with Last-Modified 2026-09-24 21:48:37Z; the directory keeps about 3.6 days of volumes, so the URL should roll off around 2026-09-28). 4,760 LDM records: Message 5 alone, then one Message 31 radial per record (9 cuts, 4,759 radials, 6 moments). Known failure: the Level II decoder caps LDM volumes at 4,096 records and refuses it with `block-bzip volume contains more than 4096 blocks`; Py-ART 2.3.0 reads all 9 sweeps. Not committed: the smallest prefix that reproduces the failure (the volume header and 4,097 records) is 17,819,782 bytes, over the 2 MB cap (see the top of this file). The feed survey left it in the shared testdata cache; the check reads it from there and is skipped elsewhere. Format nexrad-level2-feed as explained at the top of this file."

