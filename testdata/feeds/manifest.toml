# Real-feed survey fixtures (docs/testdata/feeds-survey.md).
#
# A Level II volume published by the North Dakota State Water Commission's
# GR2Analyst polling server, https://level2.swc.nd.gov/raw/, and the
# polling-directory captures that recast-radar-data's polling tests read: ND
# SWC's KXWA dir.list, the Iowa Environmental Mesonet's polling root
# config.cfg and the Laredo EWR root's grlevel2.cfg. The KXWA volume is a
# known failure of recast-radar-io's Level II decoder:
# crates/recast-radar-data/tests/feeds_known_failures.rs checks that every
# failure named by a `known-failure:*` tag still reproduces. When a fix lands
# that test fails: drop the tag (and add the decoder's own test).
#
# Conventions:
# - The Level II files use format "nexrad-level2-feed", not "nexrad-level2".
#   recast-radar-io-nexrad's corpus tests pin the exact lists of
#   nexrad-level2 entries (tests/messages_clutter.rs) and of trimmed fixtures
#   (recast-radar-testdata tests/trim.rs); a decoder fix can retype them.
# - The feeds' URLs roll off (ND SWC keeps about 3.6 days of volumes), so
#   every entry is marked ephemeral. The KXWA head (not redistributed) was
#   cut from the whole volume, which is checksum-pinned but not committed:
#   it is the head's `derived_from` source, and a check compares the head
#   with it where the shared testdata cache holds both.
# - One failure has no committed fixture: level2-ldm-block-limit needs a
#   volume of more than 4,096 LDM records, and the only one the survey found,
#   North Dakota SWC's KXWA volume, takes 17.8 MB for its first 4,097 records,
#   over the 2 MB cap for a committed file
#   (tools/feeds_survey/testdata_budget.py recounts what the 60 MB total cap
#   leaves, docs/testdata/feeds-survey.md section 4).
#   Its REF and VEL are nearly empty, but every radial carries SW, ZDR and
#   RHO noise on all 3,218 gates (about 1.0, 1.6 and 1.4 KB compressed), so
#   records stay near 4.3 KB. The
#   volume (20.6 MB) is checksum-pinned; its check runs where the shared
#   testdata cache holds it and is skipped elsewhere, CI included, like the
#   check of the head against it. Whether to commit it (and raise
#   the caps) is the owner's decision.
# - Licensing: every entry is tagged license:unknown until the review before
#   publishing. North Dakota SWC's, the Iowa Environmental Mesonet's and the
#   Laredo EWR host's terms were not checked.

