# Synthetic test inputs still in the workspace (plan task C.1).
#
# Every C.1 entry was converted to real inputs in C.2, and the tests merged
# from main in C.3 were converted too (docs/testdata/synthetic-inventory.md).
# What remains comes from the FM301 model (stream F), under
# core-data-scattering: two pending model unit tests that need a corpus file
# nobody has found yet (user review), and one exception; and from
# metadata-complete (io-nexrad, io-formats): two exceptions, and ten pending
# feature tests on edited real bytes that await the owner's decision. New
# findings must be converted; an entry may be added only as a justified
# exception (see `status` below), or as pending for the owner's review.
#
# `crates/recast-radar-testdata/tests/no_synthetic.rs` scans test code and data
# files (rules: `recast_radar_testdata::synthetic`) and fails on any finding
# that is not listed here, and on any entry that no longer matches a finding.
# docs/testdata/synthetic-inventory.md gives the real replacement for each one.
#
# One array of tables per conversion group (plan task C.2):
#   io-nexrad, io-formats, correct, filters-map, retrieve, track, render-bench,
#   core-data-scattering
# Each entry sits under the group that owns its crate (the test checks this).
#
#   [[<group>]]
#   path = "crates/<crate>/..."   # workspace-relative
#   name = "tests::helper"        # item path inside the file; omitted for a data file
#   status = "pending"            # "pending": not converted yet (C.2 entries, and
#                                 #   stream F model tests awaiting a real input);
#                                 #   delete the entry once converted
#                                 # "exception": permanent; allowed only for pure math or
#                                 #   geometry helpers that do not consume radar data, fuzz
#                                 #   regression inputs, and corruption helpers that start
#                                 #   from real bytes
#   justification = "..."         # pending: the real replacement; exception: why it stays
#
# Converting a test: switch it to real files, delete its entry and the entries of
# helpers it no longer uses. To print every current finding as tables:
#   RECAST_RADAR_SYNTHETIC_REPORT=findings.toml cargo test -p recast-radar-testdata --test no_synthetic

# ============================================================================
# io-nexrad (9 entries: 2 exceptions, 7 pending)
# ============================================================================

# All converted to real files in C.2 (see crates/recast-radar-io-nexrad/src/lib.rs
# `tests` and tools/level2_decode_golden.py). The exceptions are the RDA log
# limit test of metadata-complete: no real file holds a message 33 (a scan of
# the real Level II files and chunks of the corpus found none), so the hostile
# logs the limit must stop are built and inserted into real chunk bytes.
#
# The pending entries are the metadata-complete feature tests on edited or
# rearranged real bytes, for features no real file exercises: a sweep whose
# radials differ in the values kept once per sweep, two messages of one
# metadata type (a later different one, a repeated one), and messages 6, 9,
# 11 and 12. They are not corruption or limit tests, so they fall outside
# the exception rule; they await the owner's decision (allow them as
# exceptions, or remove them and leave the features untested). Their helpers
# are named `fabricate*` so the scanner sees them.

[[io-nexrad]]
path = "crates/recast-radar-io-nexrad/tests/radial_extras_real.rs"
name = "fabricated_differing_radials"
status = "pending"
justification = "no real input: edits five values inside the committed KTLX 2024 trim (radial 5's ELV attenuation, radial 7's VOL calibration constant, radial 9's radar identifier, radial 11's REF TOVER, radial 13's VOL latitude) because no real file has a sweep whose radials differ in them (a scan of 96 real volumes found none); awaits the owner's decision"

