# ============================================================================
# core-data-scattering (3 entries: 2 pending, 1 exception)
# ============================================================================
#
# Every legacy entry of this group was converted in C.2 (branch
# real-tests-core-data-scattering): recast-radar-core's model tests moved to
# crates/recast-radar-core/tests/{real_model,real_merge}.rs over decoded corpus
# files (goldens: tools/core_golden.py); recast-radar-data's provider-contract
# tests run over committed ORD archive listings and its tropical merge tests
# over captured NHC/GDACS feeds; recast-radar-scattering's LUT, PSD and runtime
# tests load the committed PyTMatrix 0.3.3 tables and WRF P3 tables
# (testdata/scattering/manifest.toml, goldens: tools/scattering_golden.py).
#
# The FM301 model (stream F) brought its own unit tests. When the detector
# learned the FM301 names (Volume, Sweep, Field, push_ray, add_field,
# push_row_*), the tests with a real equivalent moved to real_model.rs and
# real_merge.rs (ICD code resolution, float fill values, CF packing, buffer
# moves, Message 1 range mapping, seal, merge geometry). The row layouts no
# corpus file has (a scan of all 48 cached Level II files with Py-ART found no
# sweep where a moment is missing on some radials or where a later radial has
# more gates than the first) are built from mutated real Message 31 records in
# crates/recast-radar-core/tests/real_rows.rs. The reflectivity name
# preference moved too: no corpus file carries DBZH, DBZ and DBZV at once, so
# real_model.rs re-spells one real IESHA DBZH field under each of the three
# names (Field::new derives quantity and polarization from the name alone,
# which is what Sweep::find ranks). What remains is the 16-bit row API's own
# checks, which no decoder can reach.

[[core-data-scattering]]
path = "crates/recast-radar-core/tests/real_rows.rs"
name = "u16_rows_decode_real_big_endian_bytes_and_reject_odd_lengths"
status = "exception"
justification = "corruption helper that starts from real bytes: the big-endian gate bytes of a real KTLX 2013 PHI block, pushed whole (compared with the decoded row) and cut by one byte; the odd-length and row-order checks of Field::push_row_u16_be are unreachable through any decoder, which always hands over whole 16-bit rows once per ray"
