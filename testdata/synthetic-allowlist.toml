# Synthetic test inputs still in the workspace (plan task C.1).
#
# `crates/recast-radar-testdata/tests/no_synthetic.rs` scans test code and data
# files (rules: `recast_radar_testdata::synthetic`) and fails on any finding
# that is not listed here, and on any entry that no longer matches a finding.
# docs/testdata/synthetic-inventory.md gives the real replacement for each one.
#
# One array of tables per conversion group (plan task C.2):
#   io-nexrad, io-formats, correct, filters-map, retrieve, track, render-bench,
#   core-data-scattering
# Each entry sits under the group that owns its crate (the test checks this).
#
#   [[<group>]]
#   path = "crates/<crate>/..."   # workspace-relative
#   name = "tests::helper"        # item path inside the file; omitted for a data file
#   status = "pending"            # "pending": convert in C.2, then delete the entry
#                                 # "exception": permanent; allowed only for pure math or
#                                 #   geometry helpers that do not consume radar data, fuzz
#                                 #   regression inputs, and corruption helpers that start
#                                 #   from real bytes
#   justification = "..."         # pending: the real replacement; exception: why it stays
#
# Converting a test: switch it to real files, delete its entry and the entries of
# helpers it no longer uses. To print every current finding as tables:
#   RECAST_RADAR_SYNTHETIC_REPORT=findings.toml cargo test -p recast-radar-testdata --test no_synthetic

