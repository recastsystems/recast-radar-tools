# Schema: see testdata/manifest.toml. Provenance, derivation recipes and gaps:
# docs/testdata/corpus.md.
#
# Conventions used here:
# - `committed` paths live under files/other/<format>/.
# - Committed files that are byte-identical to a public file carry that URL
#   (pinned to a commit for GitHub-hosted files).
# - Derived fixtures name their source entry in `derived_from` when the source
#   is small enough to be a download entry; sources too large to fetch in tests
#   (multi-GB archives) are identified inside `derivation` instead.
# - Archive entries (format "tar-gz" / "tar-z", tag "archive") are the exact
#   public downloads that derived members were extracted from.

